# Builds the site and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Runs on every push to main, on demand (Actions → Run workflow), every 6 hours
# to pick up new software releases, and when another repository sends a
# "software-release" event (see BUILD_GUIDE.md → Software downloads).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  repository_dispatch:
    types: [software-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Fetch the latest software releases
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::No RELEASES_TOKEN secret found, so private software releases can't be downloaded (see BUILD_GUIDE.md)."
          fi
          npm run releases
        env:
          # Fine-grained token with read-only "Contents" access to the software repositories.
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Type-check
        run: npm run check

      - name: Build
        run: |
          if [ -n "$PUBLIC_WEB3FORMS_KEY" ]; then
            echo "Contact form: Web3Forms key configured"
          else
            echo "::notice::No WEB3FORMS_KEY secret found, so the contact form opens the visitor's email app (see README)."
          fi
          npm run build
        env:
          # Works for project sites (https://<user>.github.io/<repo>/) and custom domains alike.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Kept out of the repository: repository secret (or variable) named WEB3FORMS_KEY.
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY || vars.WEB3FORMS_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
